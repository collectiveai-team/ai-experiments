[project]
name = "ai-experiments"
version = "0.1.0"
description = "Detached experiment runtime for industrial AI training workloads"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12.0",
]
keywords = ["experiments", "training", "ray", "mlops", "monitoring"]

[project.optional-dependencies]
ray = [
  "ray[default]>=2.20.0",
]
server = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
]
mlflow = [
  "mlflow-skinny>=2.10.0",
]
# Off Linux there is no /proc, so the daemon cannot tell which process a pid
# names and refuses to kill an orphaned workload. psutil restores that (#31).
psutil = [
  "psutil>=5.9.0",
]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "ruff>=0.4.0",
  "psutil>=5.9.0",
]

[project.scripts]
iax = "ai_experiments.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: exercises real Ray/MLflow services; skipped unless they are up (see tests/integration/compose.yaml)",
]
