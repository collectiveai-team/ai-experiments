# Campaña de referencia sobre datos industriales reales.
#   iax campaign validate examples/maintenance_events/goal.yaml --strict
#   iax campaign start    examples/maintenance_events/goal.yaml
#   iax daemon
#
# Necesita el dataset: ver examples/maintenance_events/README.md.
# Para probar el loop sin dataset, agregá "--self-test" a workload.args.

goal: "Maximizar PR-AUC prediciendo una limpieza de condensador a 15 días"
name: maintenance-events

objective:
  metric: pr_auc
  # El PR-AUC crudo no es comparable entre trials: cada label_source tiene su
  # propia tasa base, así que "union" arranca arriba por tener más positivas,
  # no por ser más predecible. El objetivo es la mejora sobre la tasa base que
  # el propio trial reporta, apareada dentro de cada fold.
  baseline_metric: baseline_pr_auc
  mode: max
  # Los folds son evaluaciones independientes de la misma configuración, no
  # etapas de un entrenamiento. Quedarse con el mejor sería max-of-k, sesgado
  # hacia arriba por exactamente el ruido que los folds existen para medir.
  aggregate: mean

search_space:
  # `changes_data` marca las dimensiones que cambian los datos o las etiquetas
  # sobre las que se evalúa el trial. Sin `baseline_metric` la búsqueda
  # optimizaría la tajada más fácil en vez del modelo.
  window_days:   { type: choice, values: [30, 60, 90, 120, 180], changes_data: true }
  resample_freq: { type: choice, values: ["1h", "6h", "1D"],     changes_data: true }
  label_source:  { type: choice, values: [mapro, operator, union], changes_data: true }
  model:         { type: choice, values: [hist_gb, logreg] }

  # Perillas de gradient boosting. Sorteárselas a una regresión logística
  # produce trials que son duplicados invisibles para el deduplicador, y su
  # dispersión se lee como evidencia de que las perillas no hacen nada.
  learning_rate:
    { type: loguniform, low: 0.01, high: 0.3, when: { model: [hist_gb] } }
  max_leaf_nodes:
    { type: choice, values: [7, 15, 31],     when: { model: [hist_gb] } }
  min_samples_leaf:
    { type: choice, values: [5, 10, 20],     when: { model: [hist_gb] } }
  max_bins:
    { type: choice, values: [32, 64, 128, 255], when: { model: [hist_gb] } }

workload:
  # `--project .` y no `--project examples/maintenance_events`: una variante
  # corre sobre una copia de este directorio, con otro working_dir, y el
  # entrypoint tiene que ser el mismo en los dos casos.
  entrypoint: "uv run --project . python -m maintenance_events.train"
  # 20 folds NO es un cálculo de poder: subir folds no compra poder acá. La sd
  # del lift crece casi como raíz de k (0.129 con 12, 0.170 con 20), así que el
  # mínimo detectable queda clavado en ~0.115 de 12 a 20. Ver README.md §
  # "Cuántos folds" → "Lo que pasó cuando se midió".
  # Lo que sí cambia es el conteo de folds válidos, y de eso depende un
  # criterio: con 12, `operator` deja 9 folds con positivas y no puede cumplir
  # `min_observations: 10` haga lo que haga el modelo. Con 20 las tres fuentes
  # quedan en 14 o más.
  args: ["--n-folds", "20"]
  working_dir: "examples/maintenance_events"

# Qué tiene que mostrar esta campaña para que se le crea. Escrito antes de
# correr nada, así después la respuesta es aritmética y no una discusión.
success_criteria:
  # 0.05 de lift sobre la tasa base es lo mínimo que cambiaría una decisión de
  # mantenimiento; por debajo el modelo no paga el costo de operarlo.
  min_objective: 0.05
  # Un fold sin positivas no puntúa. Menos de 10 folds válidos deja el
  # intervalo demasiado ancho para que `min_objective` signifique algo.
  min_observations: 10
  # ATENCIÓN: medido, esto es inalcanzable con este dataset. Separar pide que el
  # mejor le saque al segundo más de 1.96 x hypot(se, se) ~ 0.114 de lift, más
  # que el lift entero que consigue cualquier config. La campaña va a reportar
  # `separated: false` y fallar el criterio, cualquiera sea el modelo. Queda en
  # true a propósito: es la respuesta honesta a "¿24 trials distinguen un
  # ganador?" y la respuesta es no. Ponerlo en false cambiaría la pregunta.
  require_separation: true
  # Y el lift tiene que despejar el cero: sin esto el ganador puede ser un
  # modelo que no le gana a predecir la tasa base.
  require_beats_baseline: true

budget:
  max_trials: 24
  max_parallel: 4
  max_hours: 1.5

strategy:
  name: adaptive
  seed: 7
  exploration: 0.4
  top_k: 3

backend: local

# Una ronda de mejora que cambia el código, no sólo los params. El agente
# escribe el archivo; el arnés lo copia, lo somete al smoke check y recién
# entonces le deja gastar trials. Ver la skill `proposing-variants`.
variants:
  enabled: true
  source_dir: "examples/maintenance_events"
  # Los dos puntos de extensión del ejemplo: cómo se resume una ventana y qué
  # modelo la lee. `evaluation.py` queda afuera a propósito — una variante que
  # puede reescribir su propia evaluación optimiza el termómetro.
  editable_paths:
    - "maintenance_events/features.py"
    - "maintenance_events/models.py"
  # Corre sobre datos sintéticos: no necesita el dataset ni el link privado, y
  # falla si la variante no importa, no featuriza o no reporta la métrica.
  smoke_command:
    ["uv", "run", "--project", ".", "python", "-m", "maintenance_events.train",
     "--self-test", "--n-folds", "2"]
  # 16 s medidos, de los cuales la mitad es crear el venv de la copia.
  smoke_timeout_seconds: 300

monitoring:
  interval_seconds: 20
  stuck_after_minutes: 10
  timeout_seconds: 900
  auto_kill: true
  fatal_on_nan: true
