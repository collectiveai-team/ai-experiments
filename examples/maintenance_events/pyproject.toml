[project]
name = "maintenance-events-example"
version = "0.1.0"
description = "Condenser cleaning forecast: the CPU-cheap iax testbed workload"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=15.0",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "gdown>=5.1",
  "threadpoolctl>=3.1",
]

[project.optional-dependencies]
prepare = ["openpyxl>=3.1"]
dev = ["pytest>=8.0", "openpyxl>=3.1", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maintenance_events"]

[tool.pytest.ini_options]
testpaths = ["tests"]
