# Named Ray cluster profiles for `iax cluster ...` and goal manifests
# (`cluster: <name>`). Copy to ./clusters.yaml or ~/.config/iax/clusters.yaml.
clusters:
  local:
    provider: local
    address: http://127.0.0.1:8265
    description: "ray start --head --dashboard-host 0.0.0.0"

  vader:
    provider: local
    address: http://vader:8265
    description: "on-prem box running a Ray head"

  # `cluster_config` is your own Ray cluster launcher YAML -- the file you
  # would pass to `ray up`. iax does not ship one; it runs `ray up`/`ray down`
  # on the path you give here, resolved from the directory you run iax in.
  # See https://docs.ray.io/en/latest/cluster/vms/index.html
  aws-gpu:
    provider: aws
    address: http://10.0.0.5:8265            # head node dashboard
    cluster_config: ./ray-aws.yaml           # used by `iax cluster up/down`

  gcp-tpu:
    provider: gcp
    cluster_config: ./ray-gcp.yaml

  azure-a100:
    provider: azure
    cluster_config: ./ray-azure.yaml
