# A research goal the harness pursues on its own. Run it with:
#   iax campaign validate goal.yaml
#   iax loop goal.yaml --json     # blocks; exit 0 = target reached, 4 = not
#
# Or drive the rounds yourself:
#   iax campaign start goal.yaml
#   iax daemon            # drives the loop and watches every trial
#
# Every key below is a field of GoalSpec (ai_experiments/schemas.py).

goal: "Describe, in one sentence, what a good result looks like"
name: my-campaign

objective:
  metric: loss            # must match a key your workload reports
  mode: min               # min | max
  target: 0.01            # optional: stop as soon as this is reached
  aggregate: best         # best | mean.  `best` treats the reported lines as
                          # stages of one training run.  Use `mean` when each
                          # line is an independent evaluation of the same
                          # config - a fold, a seed, a held-out window - so the
                          # score comes with a standard error instead of being
                          # the luckiest of k.
  # baseline_metric: baseline_loss
                          # Score the lift over a baseline the workload reports
                          # in the same line.  Needed whenever the search can
                          # change the data a trial is scored on, since raw
                          # values across different slices are not comparable.

search_space:
  lr: { type: loguniform, low: 0.0001, high: 0.1 }
  # batch_size: { type: choice, values: [16, 32, 64] }
  # layers: { type: int, low: 2, high: 8 }
  # model: { type: choice, values: [resnet, vit] }
  # window_days: { type: choice, values: [30, 90], changes_data: true }
  #                         # changes_data: this knob moves the data or the
  #                         # labels, not just the fit.  Pair it with
  #                         # objective.baseline_metric.
  # patch_size: { type: choice, values: [8, 16], when: { model: [vit] } }
  #                         # when: draw this only for the trials that read it,
  #                         # instead of sampling a knob the model ignores.

# What this campaign has to show before its result counts.  Write it before
# running anything: afterwards the bar is chosen to fit the number that came
# out.  A goal that declares nothing here reports a best trial and no verdict.
success_criteria:
  min_objective: 0.01     # the bar the objective must clear (`mode: min` reads
                          # it as "at most")
  # min_observations: 10  # refuse a score that rests on too few observations
  # require_separation: true
                          # the winner must beat the runner-up by more than the
                          # noise, at 95%.  Needs aggregate: mean.
  # require_beats_baseline: true
                          # the interval must clear the baseline.  Needs
                          # objective.baseline_metric.

workload:
  entrypoint: python
  args: ["train.py"]
  working_dir: "."

budget:
  max_trials: 8
  max_parallel: 2
  max_hours: 1.0
  # max_gpu_hours: 100
  # gpu_hour_rate: 2.50   # $/GPU-hour, for cost display only

strategy:
  name: adaptive          # grid | random | adaptive | agent
  seed: 7
  exploration: 0.3        # adaptive: fraction of fresh random samples
  top_k: 2                # adaptive: perturb around one of the best k trials
  # fallback: adaptive    # agent: used when the agent is down or off-contract

# agent:                  # only read when strategy.name is `agent`
#   command: claude       # claude | codex | any command reading a prompt on stdin
#   timeout_seconds: 600
#   max_calls: 20         # hard ceiling on agent calls for this campaign

backend: local            # or `ray` (+ backend_address / cluster)

monitoring:
  interval_seconds: 30
  stuck_after_minutes: 10
  auto_kill: true
  fatal_on_nan: true
  escalation:
    after_suspicious_ticks: 3
    cooldown_minutes: 30
    max_agent_calls: 3

analysis:
  agent_review: false     # true: ask an agent to reshape the search between
                          # rounds; it replies with `iax campaign suggest`
  review_between_rounds: false  # `iax loop`: ask the agent for a verdict after
                                # each round; a `stop` ends a hopeless campaign
  apply_agent_changes: false    # true: an accepted verdict may widen the search
                                # space or the budget (never the metric)

tracking:
  mlflow: false
